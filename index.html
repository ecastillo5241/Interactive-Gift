<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interactive Gift</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Georgia,serif;background:radial-gradient(circle at 50% 18%,#fffaf1,#e8d9c3 65%,#d4c0a5);color:#2b241e}.scene{height:100%;display:grid;place-items:center;padding:22px}.wrap{width:min(360px,92vw);height:610px;position:relative;text-align:center}.hint{font:700 11px system-ui;letter-spacing:.18em;text-transform:uppercase;opacity:.58;margin:20px 0 70px}.env{height:220px;position:relative;filter:drop-shadow(0 24px 22px #503c2835)}.back{position:absolute;inset:0;background:#d5ae7e;border-radius:8px}.card{position:absolute;left:23px;right:23px;top:20px;height:178px;background:#fffaf1;border-radius:6px;z-index:2;box-shadow:0 5px 14px #4f3d2925;transition:transform .9s ease,height .9s ease;display:flex;justify-content:center;padding-top:28px}.copy{opacity:0;transition:.5s .7s}.copy small{font:700 10px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#806b58}.copy h1{font-size:28px;font-weight:400;margin:8px}.copy p{font-size:14px;line-height:1.5;color:#63564b;margin:0}.front{position:absolute;inset:0;z-index:4;background:linear-gradient(145deg,#e9cba6,#cda373);clip-path:polygon(0 28%,50% 70%,100% 28%,100% 100%,0 100%);border-radius:8px;pointer-events:none}.flap{position:absolute;inset:0;z-index:5;background:linear-gradient(#edd3b0,#d6ad7d);clip-path:polygon(0 0,100% 0,50% 70%);transform-origin:top;transition:transform .8s ease;pointer-events:none}.seal{position:absolute;z-index:20;left:50%;top:58%;transform:translate(-50%,-50%);width:70px;height:70px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#d97a86,#96394d);color:#ffe9da;font-size:27px;box-shadow:0 5px 14px #5d273b55;cursor:pointer}.flower{position:absolute;z-index:15;left:50%;top:-3px;transform:translate(-50%,-50%) scale(0);width:150px;height:150px;border:0;background:transparent;transition:transform .9s .85s cubic-bezier(.2,.9,.2,1.2);cursor:pointer}.petal{position:absolute;left:49px;top:10px;width:52px;height:84px;border-radius:55% 55% 48% 48%;transform-origin:50% 88%;background:radial-gradient(circle at 50% 22%,#ffd2d7,#cc6078 64%,#993b54);box-shadow:inset 0 0 12px #fff7;transition:transform .8s}.p1{transform:rotate(0) translateY(-27px)}.p2{transform:rotate(60deg) translateY(-27px)}.p3{transform:rotate(120deg) translateY(-27px)}.p4{transform:rotate(180deg) translateY(-27px)}.p5{transform:rotate(240deg) translateY(-27px)}.p6{transform:rotate(300deg) translateY(-27px)}.center{position:absolute;z-index:4;left:52px;top:52px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f8d884,#ae7528);transition:.4s}.gift{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.15);transition:.7s .2s}.gift span{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;background:#fff9e9;border:1px solid #c8a668;box-shadow:0 9px 28px #55403033;font:800 12px/1.35 system-ui;color:#745323}.open .flap{transform:rotateX(180deg);z-index:1}.open .seal{display:none}.open .card{transform:translateY(-195px);height:360px;z-index:6}.open .copy{opacity:1}.open .flower{transform:translate(-50%,-50%) scale(1)}.revealed .p1{transform:rotate(0) translateY(-76px)}.revealed .p2{transform:rotate(60deg) translateY(-76px)}.revealed .p3{transform:rotate(120deg) translateY(-76px)}.revealed .p4{transform:rotate(180deg) translateY(-76px)}.revealed .p5{transform:rotate(240deg) translateY(-76px)}.revealed .p6{transform:rotate(300deg) translateY(-76px)}.revealed .center{opacity:0}.revealed .gift{opacity:1;transform:scale(1)}.replay{position:fixed;right:16px;bottom:16px;border:0;border-radius:30px;background:#ffffffc7;padding:11px 15px;font:700 12px system-ui;color:#62564b;cursor:pointer}</style></head><body><main class="scene"><div class="wrap"><div class="hint" id="hint">Tap the seal to open</div><div class="env" id="env"><div class="back"></div><div class="card"><div class="copy"><small>Just for you</small><h1>A little something</h1><p>Some gifts deserve more than a link.<br>Touch the flower.</p></div></div><div class="flap"></div><div class="front"></div><button class="seal" id="seal">✦</button><button class="flower" id="flower"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><b class="center"></b><div class="gift"><span>YOUR<br>GIFT<br>AWAITS ✦</span></div></button></div></div></main><button class="replay" id="replay">Replay</button><script>const env=document.querySelector('#env'),seal=document.querySelector('#seal'),flower=document.querySelector('#flower'),hint=document.querySelector('#hint');seal.onclick=()=>{env.classList.add('open');hint.textContent='Touch the flower'};flower.onclick=()=>{flower.classList.add('revealed');hint.textContent='Your gift is here'};document.querySelector('#replay').onclick=()=>{flower.classList.remove('revealed');env.classList.remove('open');hint.textContent='Tap the seal to open'};</script></body></html>
