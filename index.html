<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interactive Gift</title><style>
:root{--wine:#76263f;--wine2:#4a1428;--rose:#a94d66;--cream:#f8efe2;--gold:#c5a05d;--ink:#3b2928}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Georgia,serif;color:var(--ink);background:radial-gradient(ellipse at 50% 30%,#fffaf3 0,#f3e4d4 45%,#dfc9ae 100%)}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,#fff9 0,transparent 38%);mix-blend-mode:soft-light}
.scene{height:100%;display:grid;place-items:center;padding:20px}.wrap{width:min(390px,94vw);height:650px;text-align:center;position:relative}.hint{font:700 10px system-ui;letter-spacing:.28em;text-transform:uppercase;color:#79685f;margin:28px 0 100px;transition:.4s}.stage{height:300px;position:relative;perspective:900px;transform-style:preserve-3d}
.shadow{position:absolute;left:50%;top:238px;width:270px;height:55px;transform:translateX(-50%);border-radius:50%;background:#5a33262c;filter:blur(14px);transition:.9s}
.box{position:absolute;left:50%;top:85px;width:270px;height:170px;transform:translateX(-50%) rotateX(-3deg);transform-style:preserve-3d;transition:transform .25s ease}
.base{position:absolute;inset:34px 10px 0;border-radius:16px 16px 22px 22px;background:linear-gradient(145deg,#9e425b,#70223b 65%,#56162c);box-shadow:inset 0 3px 7px #e58ca05c,inset 0 -12px 20px #3b0c1c55,0 24px 35px #57302235;overflow:hidden}.base:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:48px;transform:translateX(-50%);background:linear-gradient(90deg,#b88d4b,#e2c37e 48%,#b28644);box-shadow:inset 5px 0 7px #fff4,inset -5px 0 7px #5d421f44}
.base:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff3 0 12%,transparent 27% 70%,#2e07152b);pointer-events:none}
.lid{position:absolute;z-index:7;left:0;top:20px;width:270px;height:72px;border-radius:17px;background:linear-gradient(155deg,#b4536c,#7b2943 64%,#601a32);box-shadow:inset 0 3px 5px #f0a2b24d,inset 0 -8px 12px #4b102655,0 10px 13px #41132644;transform-origin:50% 90%;transition:transform 1s cubic-bezier(.22,.75,.18,1),opacity .7s .35s}.lid:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:48px;transform:translateX(-50%);background:linear-gradient(90deg,#b78b49,#e6ca88 48%,#ad803d);box-shadow:inset 5px 0 6px #fff5,inset -5px 0 6px #62451f45}.lid:after{content:"";position:absolute;left:0;right:0;top:28px;height:28px;background:linear-gradient(#d7b56d,#b78b48);box-shadow:inset 0 4px 6px #fff3}
.bow{position:absolute;z-index:12;left:50%;top:-30px;width:155px;height:105px;transform:translateX(-50%);cursor:pointer;transition:transform .5s,opacity .55s}.knot{position:absolute;left:57px;top:40px;width:42px;height:36px;border-radius:48%;background:radial-gradient(circle at 35% 28%,#ecd18e,#bc914d 62%,#805b2d);z-index:3;box-shadow:0 5px 8px #3e281b3d,inset 3px 3px 5px #fff5}.loop{position:absolute;top:14px;width:76px;height:55px;border:17px solid #c49b56;box-shadow:inset 0 0 7px #fff6,0 4px 8px #452e1d22}.left{left:5px;border-radius:65% 35% 58% 42%;transform:rotate(18deg)}.right{right:5px;border-radius:35% 65% 42% 58%;transform:rotate(-18deg)}.tail{position:absolute;top:58px;width:28px;height:50px;background:linear-gradient(90deg,#ad803e,#e0c17c,#ad803e);clip-path:polygon(0 0,100% 0,85% 100%,50% 82%,15% 100%)}.tl{left:49px;transform:rotate(18deg)}.tr{right:49px;transform:rotate(-18deg)}
.glow{position:absolute;z-index:4;left:50%;top:85px;width:180px;height:100px;transform:translateX(-50%) scale(.2);opacity:0;border-radius:50%;background:radial-gradient(circle,#fff7c9 0,#f2c87499 35%,transparent 72%);filter:blur(7px);transition:.8s .45s}
.card{position:absolute;z-index:5;left:50%;top:96px;width:238px;height:238px;transform:translate(-50%,35px) scale(.72);opacity:0;background:linear-gradient(145deg,#fffdf8,#f6eadb);border-radius:8px;box-shadow:0 18px 32px #4d30273a;transition:1s .45s cubic-bezier(.2,.8,.2,1);padding:27px 18px}.card:after{content:"";position:absolute;inset:10px;border:1px solid #bd965844;border-radius:4px}.copy{position:relative;z-index:2}.copy small{font:700 9px system-ui;letter-spacing:.24em;color:#9a7457;text-transform:uppercase}.copy h1{font-weight:400;font-size:25px;margin:7px 0}.copy p{font-size:12px;line-height:1.45;color:#765d52;margin:0}
.flower{position:absolute;z-index:15;left:50%;top:238px;width:130px;height:130px;transform:translate(-50%,0) scale(0);border:0;background:transparent;cursor:pointer;transition:.85s 1.15s cubic-bezier(.2,.9,.2,1.2)}.petal{position:absolute;left:44px;top:7px;width:42px;height:70px;border-radius:60% 60% 44% 44%;transform-origin:50% 88%;background:radial-gradient(ellipse at 35% 20%,#f2bac2,#bd526d 58%,#79283f);box-shadow:inset 5px 5px 9px #fff5,inset -5px -6px 10px #55142d44,0 4px 7px #4c1b2d22;transition:.85s}.p1{transform:rotate(0) translateY(-22px)}.p2{transform:rotate(60deg) translateY(-22px)}.p3{transform:rotate(120deg) translateY(-22px)}.p4{transform:rotate(180deg) translateY(-22px)}.p5{transform:rotate(240deg) translateY(-22px)}.p6{transform:rotate(300deg) translateY(-22px)}.center{position:absolute;z-index:4;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#f5d991,#bf9044 58%,#785321);box-shadow:inset 3px 3px 6px #fff6,0 3px 7px #3e291d44;transition:.4s}.gift{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.1);transition:.7s .2s}.gift span{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#fffdf5,#efe0c4);border:1px solid #b88d4b;box-shadow:0 9px 25px #4d382b35,inset 0 0 0 5px #fff8;font:800 10px/1.4 system-ui;letter-spacing:.08em;color:#684f31}
.open .bow{transform:translateX(-50%) scale(1.25) rotate(10deg);opacity:0}.open .lid{transform:translateY(-75px) rotateX(62deg) rotateZ(-7deg);opacity:.18}.open .glow{opacity:1;transform:translateX(-50%) scale(1.35)}.open .card{transform:translate(-50%,-145px) scale(1);opacity:1}.open .flower{transform:translate(-50%,-155px) scale(1)}.open .shadow{transform:translateX(-50%) scale(.9);opacity:.65}
.revealed .p1{transform:rotate(0) translateY(-68px)}.revealed .p2{transform:rotate(60deg) translateY(-68px)}.revealed .p3{transform:rotate(120deg) translateY(-68px)}.revealed .p4{transform:rotate(180deg) translateY(-68px)}.revealed .p5{transform:rotate(240deg) translateY(-68px)}.revealed .p6{transform:rotate(300deg) translateY(-68px)}.revealed .center{opacity:0;transform:scale(.3)}.revealed .gift{opacity:1;transform:scale(1)}
.replay{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom));border:1px solid #fff9;border-radius:30px;background:#fff9;padding:11px 16px;font:700 11px system-ui;color:#6a5a4e;backdrop-filter:blur(8px);cursor:pointer}@media(max-height:700px){.wrap{transform:scale(.87)}.hint{margin-bottom:80px}}
</style></head><body><main class="scene"><div class="wrap"><div class="hint" id="hint">Untie your gift</div><div class="stage"><div class="shadow"></div><div class="box" id="box"><div class="base"></div><div class="glow"></div><div class="card"><div class="copy"><small>Just for you</small><h1>A little something</h1><p>Some gifts deserve<br>their own little moment.</p></div></div><div class="lid"><div class="bow" id="bow" role="button" aria-label="Open gift"><i class="loop left"></i><i class="loop right"></i><i class="tail tl"></i><i class="tail tr"></i><b class="knot"></b></div></div><button class="flower" id="flower" aria-label="Reveal gift"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><b class="center"></b><div class="gift"><span>YOUR<br>GIFT<br>AWAITS ✦</span></div></button></div></div></div></main><button class="replay" id="replay">Replay</button><script>
const box=document.querySelector('#box'),bow=document.querySelector('#bow'),flower=document.querySelector('#flower'),hint=document.querySelector('#hint');
function openGift(){box.classList.add('open');hint.textContent='Touch the flower'} bow.onclick=openGift;bow.addEventListener('touchend',e=>{e.preventDefault();openGift()},{passive:false});flower.onclick=()=>{flower.classList.add('revealed');hint.textContent='Your gift is here'};document.querySelector('#replay').onclick=()=>{flower.classList.remove('revealed');box.classList.remove('open');hint.textContent='Untie your gift'};
document.addEventListener('pointermove',e=>{if(box.classList.contains('open'))return;let x=(e.clientX/innerWidth-.5)*7,y=(e.clientY/innerHeight-.5)*-5;box.style.transform='translateX(-50%) rotateY('+x+'deg) rotateX('+(-3+y)+'deg)'});
</script></body></html>
